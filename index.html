    <style>
      /* The first paint: a loader on graphite, before any script has run. The logo waits for its reveal. */
      html, body { margin: 0; background: #0f1115; }
      .wp-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #f2f0ea; font-family: system-ui, sans-serif; }
      .wp-boot-bar { position: relative; width: min(46vw, 200px); height: 3px; overflow: hidden; background: #2b3039; }
      .wp-boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #ff6a13; animation: wp-boot 1.1s ease-in-out infinite; }
      @keyframes wp-boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .wp-boot-bar::after { width: 100%; animation: none; opacity: 0.6; } }
      .wp-boot noscript { position: absolute; bottom: 10%; padding: 0 24px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wp-boot">
        <div class="wp-boot-bar" role="progressbar" aria-label="Loading"></div>
        <noscript>WildPlayers needs JavaScript to run its games.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
